<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>راز رنگ تولد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Vazirmatn,sans-serif;color:#172033;background:linear-gradient(135deg,#fff,#eef8ff,#fff0fa);overflow-x:hidden}body:before,body:after{content:"";position:fixed;width:320px;height:320px;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-1;animation:float 8s ease-in-out infinite alternate}body:before{background:#00e5ff;top:-100px;right:-80px}body:after{background:#ff72d2;bottom:-120px;left:-80px;animation-delay:-3s}.wrap{width:min(92%,620px);margin:0 auto;padding:55px 0}.card{background:rgba(255,255,255,.72);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:34px;box-shadow:0 25px 70px rgba(45,55,90,.16);text-align:center;animation:rise .8s ease}.badge{display:inline-block;padding:8px 15px;border-radius:999px;background:#fff;box-shadow:0 8px 22px #00000012;font-size:13px;font-weight:700}.title{font-size:clamp(30px,8vw,48px);margin:20px 0 8px;font-weight:800}.sub{color:#667085;margin:0 0 28px}label{display:block;text-align:right;font-weight:700;margin-bottom:9px}select{width:100%;padding:16px;border:1px solid #dfe5ef;border-radius:16px;background:#fff;font:inherit;outline:none;cursor:pointer}button{border:0;font:inherit;font-weight:700;cursor:pointer}.show{width:100%;margin-top:15px;padding:16px;border-radius:16px;background:linear-gradient(90deg,#111827,#344054);color:#fff;box-shadow:0 12px 25px #11182725}.result{margin-top:28px;padding:25px;border-radius:26px;background:#fff;display:none;animation:rise .55s ease}.orb{width:130px;height:130px;border-radius:50%;margin:0 auto 18px;box-shadow:0 15px 45px #0003, inset -12px -12px 25px #0002;animation:pulse 2.5s infinite}.date{font-weight:700;color:#667085}.color{font-size:24px;font-weight:800;margin:7px}.trait{font-size:30px;font-weight:800;margin:10px}.desc{color:#667085;line-height:2}.share{margin-top:15px;padding:13px 20px;border-radius:14px;background:#f2f4f7;color:#172033}.credit{margin-top:22px;font-size:12px;color:#98a2b3}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes float{to{transform:translate(30px,25px) scale(1.08)}}@keyframes pulse{50%{transform:scale(1.06)}}
</style></head>
<body><main class="wrap"><section class="card"><span class="badge">✦ راز رنگ تولد ✦</span><h1 class="title">رنگِ درون من</h1><p class="sub">ماه و روز تولدت را انتخاب کن تا رنگ و ویژگی مخصوصت را ببینی.</p><label for="birth">تاریخ تولد</label><select id="birth"><option value="">انتخاب کن...</option></select><button class="show" onclick="showResult()">✨ کشف رنگ من</button><div class="result" id="result"><div class="orb" id="orb"></div><div class="date" id="date"></div><div class="color" id="color"></div><div class="trait" id="trait"></div><div class="desc" id="desc"></div><button class="share" onclick="shareResult()">📤 اشتراک‌گذاری نتیجه</button></div><div class="credit">هر روز، یک رنگ. هر رنگ، یک داستان. ✨</div></section></main>
<script>
const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const colors=[['#FF5C8A','صورتی'],['#FF8A3D','نارنجی'],['#FFD166','طلایی'],['#7ED957','سبز'],['#4DD0E1','فیروزه‌ای'],['#5B8DEF','آبی'],['#00FFFF','Cyan'],['#8B5CF6','بنفش'],['#EC4899','سرخابی'],['#F43F5E','قرمز'],['#FFD700','زرد طلایی'],['#22C55E','سبز زمردی']];
const traits=['خلاقیت','اعتمادبه‌نفس','شادی','تعادل','آرامش','عزم','قدرت','شهود','جذابیت','جسارت','اصالت','امید'];
const special={'7-10':{color:'#00FFFF',name:'Cyan',trait:'قدرت',desc:'انرژی بالا، حضور پررنگ و توانایی تأثیرگذاری از ویژگی‌های این روز است.'},'11-30':{color:'#FFD700',name:'زرد طلایی',trait:'اصالت',desc:'ذهنی مستقل، شخصیت متفاوت و تمایل به ساختن مسیر مخصوص خودت از ویژگی‌های این روز است.'}};
const sel=document.getElementById('birth');months.forEach((m,i)=>{let max=i<6?31:i<11?30:29;for(let d=1;d<=max;d++){let o=document.createElement('option');o.value=`${i+1}-${d}`;o.textContent=`${d} ${m}`;sel.appendChild(o)}});
function showResult(){if(!sel.value)return;let [m,d]=sel.value.split('-').map(Number),x=special[sel.value]||{color:colors[(m+d-2)%colors.length][0],name:colors[(m+d-2)%colors.length][1],trait:traits[(m+d-2)%traits.length],desc:'ویژگی‌های این روز ترکیبی از انرژی، شخصیت و نگاه خاص تو به زندگی است.'};document.getElementById('orb').style.background=x.color;document.getElementById('date').textContent=`${d} ${months[m-1]}`;document.getElementById('color').textContent=x.name;document.getElementById('trait').textContent=`✦ ${x.trait} ✦`;document.getElementById('desc').textContent=x.desc;document.getElementById('result').style.display='block'}
async function shareResult(){if(!sel.value)return;let text=`راز رنگ تولد من\n${document.getElementById('date').textContent}\nرنگ: ${document.getElementById('color').textContent}\nویژگی: ${document.getElementById('trait').textContent}`;if(navigator.share){try{await navigator.share({title:'راز رنگ تولد',text})}catch(e){}}else{navigator.clipboard?.writeText(text);alert('نتیجه کپی شد ✨')}}
</script></body></html>
