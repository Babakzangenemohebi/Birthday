<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eefaff">
<title>راز رنگ تولد | رنگِ درون من</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora"></div>
<main class="page">
<section class="hero"><div class="logo">🎨</div><span class="eyebrow">✦ راز رنگ تولد ✦</span><h1>رنگِ درون من</h1><p>ماه و روز تولدت رو انتخاب کن و رنگ و ویژگی مخصوص خودت رو کشف کن.</p></section>
<section class="glass panel">
<label class="label">تاریخ تولد</label>
<div class="selectors">
<div class="select-wrap"><select class="select" id="month"><option value="">ماه را انتخاب کن</option></select></div>
<div class="select-wrap"><select class="select" id="day"><option value="">روز را انتخاب کن</option></select></div>
</div>
<button class="show" onclick="showResult()">✨ کشف رنگ من</button>
<p class="hint">سال لازم نیست؛ فقط ماه و روز تولد کافیه.</p>
<div class="result" id="result">
<div class="mini">رنگ مخصوص تو</div><div class="orb" id="orb"></div><div class="date" id="date"></div><div class="color" id="color"></div><div class="trait" id="trait"></div><div class="desc" id="desc"></div><button class="share" onclick="shareResult()">📤 اشتراک‌گذاری نتیجه</button>
</div>
</section>
<div class="footer">هر روز، یک رنگ. هر رنگ، یک داستان. ✨</div>
</main><div class="toast" id="toast"></div>
<script src="script.js"></script>
</body></html>
